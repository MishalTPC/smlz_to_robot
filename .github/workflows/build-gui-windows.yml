name: Build Windows SMLX to Robot GUI
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'launch_gui.py'
      - 'requirements-gui.txt'
      - 'build_gui_windows.bat'
      - '.github/workflows/build-gui-windows.yml'

jobs:
  windows-gui:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-gui.txt
      - name: Run Python tests
        run: python -m unittest discover -s src -p "test_*.py" -v
      - name: Build Windows standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SMLX_to_Robot --paths src --add-data "assets;assets" --collect-all sectionproperties launch_gui.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SMLX_to_Robot_Windows_v0.1.0
          path: dist/SMLX_to_Robot.exe
          if-no-files-found: error
